<!DOCTYPE html>
<meta charset="utf-8" />
<title>URL sanitization: throwing custom sanitizer</title>

<script src="/rum.js" type="text/javascript"></script>
<script>
  window.sumoLogicOpenTelemetryRum.initialize({
    collectionSourceUrl: 'http://localhost:{{port}}/rum',
    serviceName: 'url-sanitization-custom-test-service',
    urlSanitizationConfig: {
      enabled: true,
      sanitizeUrl: function () {
        throw new Error('sanitizer bug');
      },
    },
  });

  history.replaceState(null, '', '?token=pagesecret');
  window.sumoLogicOpenTelemetryRum.recordError('Custom error');

  fetch('/logo.png?api_key=fetchsecret')
    .then(function (r) {
      return r.text();
    })
    .then(function () {
      Object.defineProperty(document, 'visibilityState', {
        value: 'hidden',
        configurable: true,
      });
      document.dispatchEvent(new Event('visibilitychange'));
      window.dispatchEvent(new Event('pagehide'));
      var done = document.createElement('div');
      done.id = 'flushed';
      document.body.appendChild(done);
    });
</script>
