<!DOCTYPE html>
<meta charset="utf-8" />
<title>allowedUrls test</title>

<script src="rum.js" type="text/javascript"></script>
<script>
  window.sumoLogicOpenTelemetryRum.initialize({
    collectionSourceUrl: 'http://localhost:{{port}}/rum',
    serviceName: 'allowed-urls-test-service-name',
    applicationName: 'allowed-urls-test-application-name',
    // 127.0.0.1 plays the "3rd party" host: only localhost is allowed
    allowedUrls: [/^http:\/\/localhost:/],
  });

  fetch('http://localhost:{{port}}/logo.png');
  fetch('http://127.0.0.1:{{port}}/logo.png').catch(() => {});
</script>
