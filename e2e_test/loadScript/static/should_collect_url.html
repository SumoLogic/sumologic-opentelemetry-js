<!DOCTYPE html>
<meta charset="utf-8" />
<title>shouldCollectUrl test</title>

<script src="rum.js" type="text/javascript"></script>
<script>
  window.sumoLogicOpenTelemetryRum.initialize({
    collectionSourceUrl: 'http://localhost:{{port}}/rum',
    serviceName: 'should-collect-url-test-service-name',
    applicationName: 'should-collect-url-test-application-name',
    // 127.0.0.1 plays the "3rd party" host: the callback drops it
    shouldCollectUrl: (url) => !url.includes('//127.0.0.1:'),
  });

  fetch('http://localhost:{{port}}/logo.png');
  fetch('http://127.0.0.1:{{port}}/logo.png').catch(() => {});
</script>
