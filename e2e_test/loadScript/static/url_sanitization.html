<!DOCTYPE html>
<meta charset="utf-8" />
<title>URL sanitization</title>

<script src="/rum.js" type="text/javascript"></script>
<script>
  window.sumoLogicOpenTelemetryRum.initialize({
    collectionSourceUrl: 'http://localhost:{{port}}/rum',
    serviceName: 'url-sanitization-test-service',
    urlSanitizationConfig: {
      enabled: true,
      sensitiveParams: ['custom_secret'],
      excludeDefaultParams: ['hash'],
    },
  });

  // secrets in the page URL end up in location.href / http.url of spans and logs
  history.replaceState(
    null,
    '',
    '?token=pagesecret&custom_secret=customsecret&hash=keepme&page=1#access_token=fragsecret&state=1',
  );

  window.sumoLogicOpenTelemetryRum.recordError('Custom error');

  var fetchUrls = [
    '/logo.png?api_key=fetchsecret&page=2', // built-in param, other param kept
    '/logo.png?TOKEN=casesecret&keep=1', // case-insensitive match
    '/logo.png?X-Goog-Signature=googsecret&sig=sigsecret&id_token=idsecret', // signed-URL / OIDC params
    '/logo.png?custom_secret=customfetchsecret&hash=hashkept', // custom + excluded built-in
    '/logo.png?q=a%20b&flag&token=encsecret', // untouched params keep their exact encoding
    '/logo.png?nothing=sensitive&q=a%20b&flag', // url without secrets is byte-identical
  ];

  function flush() {
    // hash-router (Angular/Vue hash mode) query, recorded as a second log once all spans have started
    history.replaceState(
      null,
      '',
      '?page=1#/login?token=routesecret&next=%2Fhome',
    );
    window.sumoLogicOpenTelemetryRum.recordError('Route error');

    // traces and logs are sent on hidden/pagehide
    Object.defineProperty(document, 'visibilityState', {
      value: 'hidden',
      configurable: true,
    });
    document.dispatchEvent(new Event('visibilitychange'));
    window.dispatchEvent(new Event('pagehide'));
    var done = document.createElement('div');
    done.id = 'flushed';
    document.body.appendChild(done);
  }

  fetchUrls
    .reduce(function (chain, url) {
      return chain.then(function () {
        return fetch(url).then(function (r) {
          return r.text();
        });
      });
    }, Promise.resolve())
    .then(function () {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/logo.png?X-Amz-Signature=xhrsecret&planet=3');
      xhr.onloadend = flush;
      xhr.send();
    });
</script>
