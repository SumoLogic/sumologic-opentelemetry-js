<!DOCTYPE html>
<meta charset="utf-8" />
<title>Web Vitals Logs test</title>

<script src="rum.js" type="text/javascript"></script>
<script>
  window.sumoLogicOpenTelemetryRum.initialize({
    collectionSourceUrl: 'http://localhost:{{port}}/rum',
    serviceName: 'web-vitals-logs-test-service',
    applicationName: 'web-vitals-logs-test-app',
    deploymentEnvironment: 'test',
    webVitalsConfig: {
      disableLogging: false,
      ttfb: {
        includeRawAttribution: ['waitingDuration', 'dnsDuration'],
      },
      fcp: {
        includeRawAttribution: ['timeToFirstByte', 'loadState'],
      },
      lcp: {
        includeRawAttribution: ['timeToFirstByte'],
      },
      inp: {
        reportAllChanges: true,
        durationThreshold: 0,
        includeRawAttribution: [
          'inputDelay',
          'processingDuration',
          'presentationDelay',
          'interactionType',
        ],
      },
      cls: {
        includeRawAttribution: ['largestShiftTarget', 'largestShiftValue'],
      },
    },
  });
</script>

<!-- button makes the element explicitly interactive for INP; h1 inside is the LCP candidate -->
<button id="inp-target" style="padding: 10px; font-size: 16px">
  <h1 id="lcp-target" style="margin: 0">Web Vitals Logs Test</h1>
</button>

<script>
  function flushVitals() {
    Object.defineProperty(document, 'visibilityState', {
      value: 'hidden',
      writable: true,
      configurable: true,
    });
    document.dispatchEvent(new Event('visibilitychange'));
    window.dispatchEvent(new Event('pagehide'));
    var done = document.createElement('div');
    done.id = 'vitals-flushed';
    document.body.appendChild(done);
  }

  // pointerdown listener is required for PerformanceEventTiming to record a pointerdown entry,
  // which web-vitals needs to attribute the interaction as an INP candidate
  document
    .getElementById('inp-target')
    .addEventListener('pointerdown', function () {});

  document.getElementById('inp-target').addEventListener(
    'click',
    function () {
      // Delay flush until after the idle callback processes the interaction entry
      setTimeout(flushVitals, 1500);
    },
    { once: true },
  );
</script>
