<!DOCTYPE html>
<meta charset="utf-8" />
<title>URL sanitization disabled</title>

<script src="/rum.js" type="text/javascript"></script>
<script>
  // no urlSanitizationConfig: default is off, urls must be exported exactly as captured
  window.sumoLogicOpenTelemetryRum.initialize({
    collectionSourceUrl: 'http://localhost:{{port}}/rum',
    serviceName: 'url-sanitization-disabled-test-service',
  });

  history.replaceState(
    null,
    '',
    '?token=pagesecret&page=1#access_token=fragsecret',
  );
  window.sumoLogicOpenTelemetryRum.recordError('Custom error');

  fetch('/logo.png?api_key=fetchsecret&q=a%20b&flag')
    .then(function (r) {
      return r.text();
    })
    .then(function () {
      Object.defineProperty(document, 'visibilityState', {
        value: 'hidden',
        configurable: true,
      });
      document.dispatchEvent(new Event('visibilitychange'));
      window.dispatchEvent(new Event('pagehide'));
      var done = document.createElement('div');
      done.id = 'flushed';
      document.body.appendChild(done);
    });
</script>
